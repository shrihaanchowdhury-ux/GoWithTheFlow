{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}

<div>
    <h1>To Become Part of the Flow, Sign Up!</h1>
    <p>Sign in or create your account to unlock all features.</p>

    <h2 id="formTitle">Sign In</h2>

    <form id="pForm">
        <div id="nameDiv" style="display: none;">
            <label for="pName">Name</label>
            <input type="text" id="pName" placeholder="Your name">
        </div>

        <div>
            <label for="pEmail">Email</label>
            <input type="email" id="pEmail" required placeholder="you@example.com">
        </div>

        <div>
            <label for="pPassword">Password</label>
            <input type="password" id="pPassword" required placeholder="Password">
        </div>

        <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <p>
        <span id="toggleText">Don't have an account?</span> 
        <a href="#" onclick="toggleMode(event)" id="toggleLink">Sign Up</a>
    </p>
</div>

<script>
let isSignUp = false;

function toggleMode(e) {
    e.preventDefault();
    isSignUp = !isSignUp;
    
    document.getElementById('formTitle').innerText = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('submitBtn').innerText = isSignUp ? 'Sign Up' : 'Sign In';
    document.getElementById('nameDiv').style.display = isSignUp ? 'block' : 'none';
    document.getElementById('pName').required = isSignUp;
    document.getElementById('toggleText').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggleLink').innerText = isSignUp ? 'Sign In' : 'Sign Up';
}

document.getElementById('pForm').addEventListener('submit', e => {
    e.preventDefault();
    
    const name = document.getElementById('pName').value.trim();
    const email = document.getElementById('pEmail').value.trim();
    const displayName = isSignUp ? name : (localStorage.getItem('flowi_name') || email.split('@')[0]);

    localStorage.setItem('flowi_signed_in', 'true');
    localStorage.setItem('flowi_name', displayName);
    localStorage.setItem('flowi_email', email);

    window.location.href = "{{ url_for('community') }}";
});
</script>

{% endblock %}
